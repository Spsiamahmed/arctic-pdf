<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Arctic PDF Compressor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --arctic-deep: #125488; --arctic-teal: #3DD9D6; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #090e16; 
            color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .arctic-gradient { background: linear-gradient(135deg, var(--arctic-deep) 0%, var(--arctic-teal) 100%); }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 28px;
        }
        /* Premium Slider UI */
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; }
        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 22px; width: 22px; 
            background: var(--arctic-teal); border-radius: 50%; 
            cursor: pointer; box-shadow: 0 0 15px rgba(61,217,214,0.4);
            border: 3px solid #090e16;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <nav class="fixed top-4 z-50 glass-card px-5 py-3 flex gap-6 items-center shadow-2xl border-white/5 mx-4">
        <a href="index.html" class="text-gray-400 hover:text-white text-xs font-bold transition-all uppercase tracking-widest">← Back</a>
        <div class="h-4 w-[1px] bg-white/10"></div>
        <span class="text-teal-400 text-xs font-black uppercase tracking-[0.2em]">Arctic Engine</span>
    </nav>

    <main class="w-full max-w-2xl pt-28 pb-12 px-5">
        <div class="glass-card p-6 md:p-10 shadow-2xl overflow-hidden relative">
            
            <header class="mb-10 text-center md:text-left">
                <h2 class="text-2xl md:text-4xl font-extrabold tracking-tighter">Compress <span class="text-teal-400">PDF</span></h2>
                <p class="text-gray-500 text-xs md:text-sm font-medium mt-2">Maximum efficiency, Zero quality loss.</p>
            </header>
            
            <div id="dropzone" class="bg-white/[0.01] border-2 border-dashed border-white/10 rounded-[24px] p-10 md:p-16 text-center hover:border-teal-500/40 transition-all cursor-pointer group mb-8">
                <input type="file" id="fileInput" class="hidden" accept=".pdf">
                <div id="fileInfo">
                    <div class="w-16 h-16 arctic-gradient rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </div>
                    <p id="fileStatus" class="text-gray-400 font-bold text-sm md:text-base">Tap to select your PDF</p>
                </div>
            </div>

            <div id="statsBox" class="hidden grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5">
                    <p class="text-[9px] uppercase font-black text-gray-500 tracking-widest mb-1">Source Size</p>
                    <p id="sizeBefore" class="text-lg font-bold">0 KB</p>
                </div>
                <div class="bg-teal-500/5 p-4 rounded-2xl border border-teal-500/10">
                    <p class="text-[9px] uppercase font-black text-teal-500 tracking-widest mb-1">Optimized</p>
                    <p id="sizeAfter" class="text-lg font-bold text-teal-400">Waiting...</p>
                </div>
            </div>

            <div class="space-y-8">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">Compression Quality</label>
                    <span id="qualityLabel" class="text-teal-400 font-bold bg-teal-400/10 px-3 py-1 rounded-lg text-xs">70%</span>
                </div>
                <input type="range" id="quality" min="10" max="100" value="70" class="w-full">
                
                <div id="progressBox" class="hidden space-y-3 py-4 animate-in fade-in duration-500">
                    <div class="flex justify-between text-[10px] font-black uppercase text-teal-500">
                        <span id="statusText">Processing Engine...</span>
                        <span id="percentLabel">0%</span>
                    </div>
                    <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full arctic-gradient shadow-[0_0_15px_rgba(61,217,214,0.4)] transition-all duration-300 w-0"></div>
                    </div>
                </div>

                <button id="actionBtn" class="w-full py-5 arctic-gradient hover:brightness-110 rounded-2xl font-black text-black text-lg transition-all active:scale-[0.97] shadow-xl">
                    OPTIMIZE NOW
                </button>
            </div>
        </div>
    </main>

    <footer class="mt-auto py-10 text-center px-6 border-t border-white/5 w-full">
        <div class="max-w-xl mx-auto flex flex-col md:flex-row justify-center items-center gap-4 text-[10px] text-gray-600 font-bold uppercase tracking-[0.2em]">
            <a href="https://spsiamahmed.github.io/main/" class="hover:text-teal-400 transition-colors">By SP Siam Ahmed</a>
            <span class="hidden md:inline text-white/10">|</span>
            <a href="https://spsiamahmed.github.io/nlithagency/" class="hover:text-teal-400 transition-colors">NLITH Agency Product</a>
        </div>
    </footer>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 bg-white text-black px-8 py-4 rounded-2xl font-black shadow-2xl transition-all duration-500 flex items-center gap-3 z-50 text-xs">
        <span id="toastMsg">Action Successful</span>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const ArcticEngine = {
            file: null,
            init() {
                const qInput = document.getElementById('quality');
                const fInput = document.getElementById('fileInput');

                qInput.oninput = (e) => document.getElementById('qualityLabel').innerText = e.target.value + '%';
                document.getElementById('dropzone').onclick = () => fInput.click();
                fInput.onchange = (e) => this.load(e.target.files[0]);
                document.getElementById('actionBtn').onclick = () => this.run();
            },

            formatSize(bytes) {
                if (bytes === 0) return '0 KB';
                const i = Math.floor(Math.log(bytes) / Math.log(1024));
                return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + ['B', 'KB', 'MB', 'GB'][i];
            },

            load(file) {
                if(file && file.type === "application/pdf") {
                    this.file = file;
                    document.getElementById('fileStatus').innerText = file.name;
                    document.getElementById('statsBox').classList.remove('hidden');
                    document.getElementById('sizeBefore').innerText = this.formatSize(file.size);
                }
            },

            notify(msg) {
                const t = document.getElementById('toast');
                document.getElementById('toastMsg').innerText = msg;
                t.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
            },

            async run() {
                if(!this.file) return this.notify("SELECT A PDF FILE FIRST");
                
                const btn = document.getElementById('actionBtn');
                const prog = document.getElementById('progressBox');
                const bar = document.getElementById('progressBar');
                const quality = document.getElementById('quality').value / 100;

                btn.disabled = true; btn.style.opacity = "0.4";
                prog.classList.remove('hidden');

                try {
                    const arr = await this.file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arr}).promise;
                    const out = await PDFLib.PDFDocument.create();

                    for (let i = 1; i <= pdf.numPages; i++) {
                        document.getElementById('statusText').innerText = `Optimizing Page ${i}/${pdf.numPages}`;
                        const page = await pdf.getPage(i);
                        const v = page.getViewport({scale: 1.2}); // Optimized scale
                        
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.height = v.height; canvas.width = v.width;
                        await page.render({canvasContext: ctx, viewport: v}).promise;
                        
                        const imgData = canvas.toDataURL('image/jpeg', quality);
                        const imgBytes = await (await fetch(imgData)).arrayBuffer();
                        const img = await out.embedJpg(imgBytes);
                        
                        const outPage = out.addPage([v.width, v.height]);
                        outPage.drawImage(img, { x: 0, y: 0, width: v.width, height: v.height });

                        const p = Math.round((i / pdf.numPages) * 100);
                        bar.style.width = p + '%';
                        document.getElementById('percentLabel').innerText = p + '%';
                        canvas.remove();
                    }

                    const finalBytes = await out.save();
                    const blob = new Blob([finalBytes], {type: 'application/pdf'});
                    document.getElementById('sizeAfter').innerText = this.formatSize(blob.size);
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `Optimized_${this.file.name}`;
                    link.click();
                    this.notify("SUCCESSFULLY COMPRESSED");
                } catch(e) { this.notify("ENGINE ERROR"); }
                finally { btn.disabled = false; btn.style.opacity = "1"; setTimeout(() => prog.classList.add('hidden'), 3000); }
            }
        };

        ArcticEngine.init();
    </script>
</body>
</html>
